# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:                                   # cancela ejecuciones viejas de la misma rama
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:                                  # contenedores auxiliares durante el job
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gastos
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastos" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://gastos:gastos@localhost:5432/gastos
      REDIS_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-no-es-secreto
      JWT_SIGNING_KEY: ci-no-es-secreto

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sistema (WeasyPrint, Tesseract, gettext)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 tesseract-ocr tesseract-ocr-spa gettext

      - name: Dependencias
        run: uv sync --locked

      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest -n auto --cov --cov-report=xml --cov-fail-under=85

      - name: Esquema OpenAPI sin avisos y sin cambios sin commitear
        run: |
          uv run python manage.py spectacular --file schema.yml --validate --fail-on-warn
          git diff --exit-code schema.yml

      - name: check --deploy con ajustes de producción
        env: # prod.py exige todas estas (sin valores por defecto, a propósito): sin ellas, ImproperlyConfigured
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-una-clave-larga-y-aleatoria-solo-para-el-check-deploy-0123456789 # la del job es corta: W009
          DJANGO_ALLOWED_HOSTS: gastos.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://gastos.example.com
          FRONTEND_URL: https://gastos.example.com
          IA_API_KEY: ci
          BANCO_WEBHOOK_SECRET: ci
          S3_BUCKET: ci
          S3_ENDPOINT_URL: https://s3.example.com
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          SMTP_HOST: ci
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          SENTRY_DSN: ""
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Auditoría de dependencias
        run: uvx pip-audit --strict
        continue-on-error: true                 # informa sin bloquear (decide tu política)

  arquitectura: # módulo 87: las capas de la arquitectura hexagonal. Sin PostgreSQL, sin Redis: no los necesita
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-no-es-secreto
      JWT_SIGNING_KEY: ci-no-es-secreto
      DATABASE_URL: postgres://nadie:nada@localhost:1/no_existe # si un test de dominio tocara la BD, fallaría
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Capas (import-linter, contratos en pyproject.toml)
        run: uv run lint-imports
      - name: Dominio y use cases, sin base de datos
        run: uv run pytest core/tests/domain finanzas/tests/domain finanzas/tests/application finanzas/tests/fakes

  estadisticas: # módulo 85: el microservicio, con PostgreSQL y Kafka de verdad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estadisticas
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gastos
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastos" --health-interval 5s --health-timeout 5s --health-retries 10
      kafka: # la configuración por defecto de la imagen: un nodo KRaft escuchando en localhost:9092
        image: apache/kafka:4.3.2
        ports: ["9092:9092"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: estadisticas/uv.lock
      - run: uv sync --locked
      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Esperar a Kafka
        run: |
          for _ in $(seq 1 30); do
            uv run python -c "from confluent_kafka.admin import AdminClient as A; A({'bootstrap.servers':'localhost:9092'}).list_topics(timeout=2)" && exit 0
            sleep 2
          done
          exit 1
      - name: Tests (también los de Kafka)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx prettier --check .                           # formato
      - name: fronteras (reglas de dependencia entre features, core y shared, módulo 80)
        run: npm run lint
      - run: npx openapi-typescript@7 ../backend/schema.yml -o src/app/core/api/esquema.ts
      - run: git diff --exit-code src/app/core/api/esquema.ts    # tipos sincronizados con la API (módulo 80)
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production          # falla si se superan los budgets (módulo 57)
      - run: npm audit --audit-level=high
        continue-on-error: true
  infra: # módulo 86: Terraform, scripts, secretos cifrados y la configuración de Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - name: Terraform (formato, validez y tests con providers simulados, sin credenciales ni estado)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Scripts
        run: shellcheck infra/*.sh
      - name: Los secretos están cifrados
        run: |
          curl -fsSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops
          for f in infra/secretos/produccion.env infra/secretos/staging.env; do
            [ -f "$f" ] || continue                          # aún sin crear: nada que comprobar
            sops filestatus "$f" | grep -q '"encrypted":true' || { echo "::error file=$f::¡$f está EN CLARO!"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: vercel.json (lo compila la CLI de Vercel, sin cuenta)
        working-directory: frontend
        run: |
          npm ci
          mkdir -p .vercel && echo '{"projectId":"_","orgId":"_","settings":{}}' > .vercel/project.json
          npx --yes vercel@65.1.0 build --yes
          jq -e '.routes[] | select(.handle == "filesystem")' .vercel/output/config.json > /dev/null
          node ../infra/csp.mjs .vercel/output > /dev/null    # la CSP con los hashes de autoCsp (como al desplegar)

  e2e:
    needs: [backend, frontend]                 # solo si lo rápido ya pasa: E2E es lo más lento
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gastos_e2e                # el nombre que usa config.settings.e2e
          POSTGRES_USER: gastos
          POSTGRES_PASSWORD: gastos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastos" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:                                   # backend de resultados de Celery (el chord de importaciones)
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgres://gastos:gastos@localhost:5432/gastos_e2e
      DJANGO_SECRET_KEY: ci-no-es-secreto
      JWT_SIGNING_KEY: ci-no-es-secreto
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Sistema (Tesseract para el OCR real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend preparado
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.e2e
        run: |
          uv sync --locked
          uv run python manage.py migrate --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test               # arranca runserver (con preparar_e2e) y ng serve él solo

      - name: Informe y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
