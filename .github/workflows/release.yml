# .github/workflows/release.yml — imágenes a GHCR y despliegue en la VM (módulos 66 y 83)
name: Release

on:
  push:
    tags: ["v*"]                    # git tag v1.0.0 && git push --tags
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    strategy:
      matrix:
        include:
          - nombre: backend
            contexto: backend
            dockerfile: backend/Dockerfile
          - nombre: proxy
            contexto: .
            dockerfile: infra/proxy.Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3            # arm64 emulado: la VM gratuita de Oracle es ARM
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gastos-${{ matrix.nombre }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  desplegar:
    needs: imagenes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: produccion
    concurrency: produccion           # nunca dos despliegues a la vez
    steps:
      - uses: actions/checkout@v4
      - name: Copiar compose e infra
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USUARIO }}
          key: ${{ secrets.SERVIDOR_SSH_KEY }}
          source: "compose.prod.yaml,infra/desplegar.sh,infra/backup.sh"
          target: /opt/gastos
      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USUARIO }}
          key: ${{ secrets.SERVIDOR_SSH_KEY }}
          script: cd /opt/gastos && VERSION=${{ github.ref_name }} ./infra/desplegar.sh
