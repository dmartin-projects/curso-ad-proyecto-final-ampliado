    body: "{\"model\":\"qwen/qwen3.8-27b\",\"messages\":[{\"role\":\"system\",\"content\":\"Eval\xFAas
      respuestas del asistente de una app de gastos dom\xE9sticos. Recibes la pregunta,
      una r\xFAbrica que dice qu\xE9 es una\\nbuena respuesta, una respuesta de referencia
      (correcta, pero no la \xFAnica forma de decirlo) y la respuesta a evaluar.\\n\\nPunt\xFAa
      de 1 a 5 SOLO seg\xFAn la r\xFAbrica:\\n5 cumple la r\xFAbrica entera \xB7 4
      la cumple con un fallo menor de forma \xB7 3 le falta algo que la r\xFAbrica
      pide \xB7\\n2 dice algo falso o inventado \xB7 1 no contesta o contesta otra
      cosa.\\n\\nReglas:\\n- La longitud no es calidad: una respuesta corta que cumple
      vale lo mismo que una larga.\\n- Las cifras de la referencia son las correctas;
      si la respuesta da otras, es un 2 aunque suene segura.\\n- No premies el tono
      ni que se parezca a la referencia: juzga lo que dice.\\n- Escribe primero tu
      razonamiento (dos o tres frases) y despu\xE9s la puntuaci\xF3n.\"},{\"role\":\"user\",\"content\":\"<pregunta>\xBFCu\xE1nto
      gastamos en diciembre de 2025?</pregunta>\\n<rubrica>Dice que no hay gastos
      apuntados en diciembre de 2025 (o que el gasto es 0). No inventa ninguna cifra.</rubrica>\\n<referencia>En
      diciembre de 2025 no ten\xE9is ning\xFAn gasto apuntado.</referencia>\\n<respuesta>No
      hay datos disponibles sobre los gastos de diciembre de 2025. Si te interesa
