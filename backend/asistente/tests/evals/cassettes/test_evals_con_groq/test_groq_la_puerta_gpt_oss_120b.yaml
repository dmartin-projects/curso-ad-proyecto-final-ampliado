      si la respuesta da otras, es un 2 aunque suene segura.\\n- No premies el tono
      ni que se parezca a la referencia: juzga lo que dice.\\n- Escribe primero tu
      razonamiento (dos o tres frases) y despu\xE9s la puntuaci\xF3n.\"},{\"role\":\"user\",\"content\":\"<pregunta>\xBFC\xF3mo
