      por ejemplo 2026-09. Si no lo env\xEDas: el mes en curso del hogar.\",\"type\":\"string\"}},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"comparar_meses\",\"description\":\"Compara
      el gasto de dos meses por categor\xEDa principal: cu\xE1nto en cada uno y la
      diferencia, de la que m\xE1s cambia a la que menos. 'con' es el mes de referencia
