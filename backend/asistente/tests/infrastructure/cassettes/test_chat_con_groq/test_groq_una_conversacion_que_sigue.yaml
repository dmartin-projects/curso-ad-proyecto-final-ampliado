      en agosto?\"},{\"role\":\"assistant\",\"content\":null,\"tool_calls\":[{\"id\":\"fc_9c697bc8-4ba2-43a8-b35f-b8fd9535f3c3\",\"type\":\"function\",\"function\":{\"name\":\"resumen_mes\",\"arguments\":\"{\\\"mes\\\":\\\"2026-08\\\"}\"}}]},{\"role\":\"tool\",\"tool_call_id\":\"fc_9c697bc8-4ba2-43a8-b35f-b8fd9535f3c3\",\"content\":\"{\\\"mes\\\":\\\"2026-08\\\",\\\"gastos\\\":\\\"671.35\\\",\\\"ingresos\\\":\\\"2100.00\\\",\\\"balance\\\":\\\"1428.65\\\",\\\"movimientos\\\":8,\\\"gastos_mes_anterior\\\":\\\"0.00\\\",\\\"variacion_gastos_pct\\\":null}\"}],\"stream_options\":{\"include_usage\":true},\"tool_choice\":\"auto\",\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"resumen_mes\",\"description\":\"Totales
