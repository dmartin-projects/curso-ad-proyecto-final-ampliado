      de ING\xBB). Si hay varios parecidos, te los devuelve para que preguntes cu\xE1l.\",\"parameters\":{\"additionalProperties\":false,\"properties\":{\"texto\":{\"description\":\"Palabras
      del recuerdo que hay que olvidar: \xABING\xBB.\",\"maxLength\":200,\"minLength\":2,\"type\":\"string\"}},\"required\":[\"texto\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"buscar_ayuda\",\"description\":\"Busca
      en la ayuda de la app c\xF3mo se hace algo en Gastos (importar un extracto,
      invitar a alguien, la verificaci\xF3n en dos pasos\u2026). Para dudas sobre
      la app, no sobre los datos del hogar. Contesta con lo que diga y cita la secci\xF3n.\",\"parameters\":{\"additionalProperties\":false,\"properties\":{\"pregunta\":{\"description\":\"La
