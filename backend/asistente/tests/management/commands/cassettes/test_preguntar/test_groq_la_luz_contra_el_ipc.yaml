        (ND)\"}}},\"geo\":{\"label\":\"Geopolitical entity (reporting)\",\"category\":{\"index\":{\"ES\":0},\"label\":{\"ES\":\"Spain\"}}},\"time\":{\"label\":\"Time\",\"category\":{\"index\":{\"2024-10\":0,\"2024-11\":1,\"2024-12\":2,\"2025-01\":3,\"2025-02\":4,\"2025-03\":5,\"2025-04\":6,\"2025-05\":7,\"2025-06\":8,\"2025-07\":9,\"2025-08\":10,\"2025-09\":11,\"2025-10\":12,\"2025-11\":13,\"2025-12\":14,\"2026-01\":15,\"2026-02\":16,\"2026-03\":17,\"2026-04\":18,\"2026-05\":19,\"2026-06\":20,\"2026-07\":21,\"2026-08\":22,\"2026-09\":23},\"label\":{\"2024-10\":\"2024-10\",\"2024-11\":\"2024-11\",\"2024-12\":\"2024-12\",\"2025-01\":\"2025-01\",\"2025-02\":\"2025-02\",\"2025-03\":\"2025-03\",\"2025-04\":\"2025-04\",\"2025-05\":\"2025-05\",\"2025-06\":\"2025-06\",\"2025-07\":\"2025-07\",\"2025-08\":\"2025-08\",\"2025-09\":\"2025-09\",\"2025-10\":\"2025-10\",\"2025-11\":\"2025-11\",\"2025-12\":\"2025-12\",\"2026-01\":\"2026-01\",\"2026-02\":\"2026-02\",\"2026-03\":\"2026-03\",\"2026-04\":\"2026-04\",\"2026-05\":\"2026-05\",\"2026-06\":\"2026-06\",\"2026-07\":\"2026-07\",\"2026-08\":\"2026-08\",\"2026-09\":\"2026-09\"}}}},\"extension\":{\"lang\":\"EN\",\"description\":\"<p>The
