      meses, c\xF3mo vais\\nde presupuesto, c\xF3mo acabar\xE9is el mes, en qu\xE9
      comercios gast\xE1is m\xE1s, lo que dice un ticket, el tipo de cambio de una\\nmoneda
      o c\xF3mo han subido los precios (IPC). Tambi\xE9n dibuja gr\xE1ficos y exporta
      movimientos a CSV. Y contesta dudas\\nsobre c\xF3mo se usa la app, con esta
      ayuda.\\n\\n[4] Movimientos y cuentas \xB7 Apuntar un gasto o un ingreso\\nEn
      **Movimientos**, pulsa **Nuevo**: importe, concepto, fecha, cuenta y categor\xEDa.
      Un gasto es un importe negativo\\ny un ingreso, positivo; el formulario lo pone
      por ti seg\xFAn la categor\xEDa (las de ingresos est\xE1n marcadas as\xED en\\n**Categor\xEDas**).
      Tambi\xE9n puedes ped\xEDrselo al asistente (\\\"apunta 3,50 \u20AC de churros\\\"):
      te prepara el movimiento y no se\\nguarda hasta que lo confirmas.\\n\\n[5] Tickets:
