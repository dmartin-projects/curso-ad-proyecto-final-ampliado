- request:
    body: "{\"model\":\"openai/gpt-oss-20b\",\"messages\":[{\"role\":\"user\",\"content\":\"Pregunta
      de una persona sobre la app Gastos: quiero que mi pareja pueda ver nuestras
      cuentas, \xBFc\xF3mo la meto?\\n\\nPasajes de la ayuda de la app:\\n[1] Empezar
      con Gastos \xB7 Qu\xE9 es un hogar\\nEn Gastos todo pertenece a un **hogar**:
      las cuentas, los movimientos, las categor\xEDas, los presupuestos y los\\ninformes.
      Un hogar puede ser tu casa, un piso compartido o la econom\xEDa de una pareja.
      Puedes pertenecer a varios\\nhogares y cambiar de uno a otro desde **Mis hogares**.\\n\\n[2]
      Movimientos y cuentas \xB7 Cuentas\\nCada movimiento es de una cuenta del hogar
      (la del banco, la tarjeta, el efectivo\u2026). El saldo de cada cuenta es la\\nsuma
      de sus movimientos. Una cuenta que ya no usas se puede desactivar: sus movimientos
      se quedan.\\n\\n[3] Miembros y roles \xB7 Invitaciones\\nLas invitaciones las
      env\xEDa un administrador del hogar, por correo. El enlace del correo caduca
      a los **7 d\xEDas**: si\\ncaduca, pide que te env\xEDen otra. Al aceptarla entras
      en el hogar con el rol que eligi\xF3 quien te invit\xF3. Si a\xFAn no\\ntienes
      cuenta, el enlace te lleva a crearla.\\n\\n[4] La seguridad de tu cuenta \xB7
      Formas de entrar\\nEn **M\xE9todos de acceso** ves c\xF3mo puedes entrar: con
      tu **contrase\xF1a** y con las **cuentas vinculadas** (Google,\\nGitHub, Apple
      o Microsoft). Puedes vincular y desvincular cuentas, siempre que te quede al
      menos una forma de entrar.\\n\\n[5] Miembros y roles \xB7 Los tres roles\\nCada
      miembro de un hogar tiene un rol:\\n\\n- **Administrador**: todo, incluido gestionar
      los miembros y borrar el hogar.\\n- **Miembro**: apunta, edita y borra movimientos,
      sube tickets, importa extractos y crea presupuestos y categor\xEDas.\\n- **Solo
      lectura**: lo ve todo, pero no cambia nada. Puede usar el asistente para preguntar,
      pero no confirmar lo\\n  que el asistente propone apuntar.\\n\\n[6] Miembros
      y roles \xB7 Salir de un hogar\\nCualquier miembro puede salir de un hogar,
      salvo el \xFAltimo administrador: un hogar necesita siempre uno, as\xED que\\nantes
      tiene que nombrar a otro. Tus movimientos se quedan en el hogar; tus conversaciones
      con el\\nasistente de ese hogar dejan de estar a tu alcance.\\n\\n[7] Movimientos
      y cuentas \xB7 Apuntar un gasto o un ingreso\\nEn **Movimientos**, pulsa **Nuevo**:
      importe, concepto, fecha, cuenta y categor\xEDa. Un gasto es un importe negativo\\ny
      un ingreso, positivo; el formulario lo pone por ti seg\xFAn la categor\xEDa
      (las de ingresos est\xE1n marcadas as\xED en\\n**Categor\xEDas**). Tambi\xE9n
      puedes ped\xEDrselo al asistente (\\\"apunta 3,50 \u20AC de churros\\\"): te
      prepara el movimiento y no se\\nguarda hasta que lo confirmas.\\n\\n[8] Miembros
      y roles \xB7 Lo que ve cada uno\\nTodos los miembros ven los mismos movimientos,
      presupuestos e informes del hogar. Lo que es solo tuyo: tus\\nconversaciones
      con el asistente y lo que le has pedido que recuerde. Los dem\xE1s miembros
      no las ven.\\n\\n\xBFQu\xE9 pasajes ayudan a contestar la pregunta? Devuelve
