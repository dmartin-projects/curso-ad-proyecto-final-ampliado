      y aplicaciones conectadas) est\xE1 en el men\xFA de tu usuario, arriba a la\\nderecha.\\n\\n[6]
      Tickets: una foto y el gasto se apunta solo \xB7 Subir un ticket\\nEn **Tickets**,
      sube la foto de un ticket de compra o un PDF (hasta 10 MB) y elige la cuenta
