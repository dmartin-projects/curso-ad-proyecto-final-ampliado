      o con un ticket, y el banco trae ese mismo cargo (mismo importe, con hasta 3
      d\xEDas\\nde diferencia), Gastos los empareja (concilia) en lugar de duplicarlo.
      Si el emparejamiento no es correcto, puedes\\ndeshacerlo e importar la fila
      como gasto nuevo.\\n\\n[2] Categor\xEDas \xB7 Gastos e ingresos\\nCada categor\xEDa
      es de gastos o de ingresos (**Es de ingresos**). As\xED el formulario de movimientos
      sabe el signo del\\nimporte y los res\xFAmenes separan lo que entra de lo que
      sale.\\n\\n[3] Empezar con Gastos \xB7 Qu\xE9 es un hogar\\nEn Gastos todo pertenece
      a un **hogar**: las cuentas, los movimientos, las categor\xEDas, los presupuestos
      y los\\ninformes. Un hogar puede ser tu casa, un piso compartido o la econom\xEDa
      de una pareja. Puedes pertenecer a varios\\nhogares y cambiar de uno a otro
      desde **Mis hogares**.\\n\\n[4] Movimientos y cuentas \xB7 Exportar a CSV\\nEl
      asistente puede exportar tus movimientos a un CSV (para Excel u otra hoja de
      c\xE1lculo): p\xEDdeselo con las fechas\\nque quieras (\\\"p\xE1same a Excel
      los gastos de septiembre\\\"). El archivo usa punto y coma como separador y
      se abre\\ndirectamente en Excel en espa\xF1ol.\\n\\n[5] Empezar con Gastos \xB7
      Las secciones de la app\\nDentro de un hogar, el men\xFA tiene: **Resumen**
      (el dashboard del mes), **Movimientos**, **Tickets**, **Importar\\nextracto**,
      **Presupuestos**, **Categor\xEDas**, **Informes** y **Asistente**. Tu cuenta
