      la contesta, una lista vac\xEDa.\"}],\"max_completion_tokens\":400,\"reasoning_effort\":\"low\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"pasajes_relevantes\",\"schema\":{\"additionalProperties\":false,\"properties\":{\"relevantes\":{\"items\":{\"type\":\"integer\"},\"type\":\"array\"}},\"required\":[\"relevantes\"],\"type\":\"object\"},\"strict\":true}}}"
