      en el hogar con el rol que eligi\xF3 quien te invit\xF3. Si a\xFAn no\\ntienes
      cuenta, el enlace te lleva a crearla.\\n\\n[3] Informes mensuales en PDF \xB7
      Qui\xE9n puede\\nPedir un informe necesita el rol de miembro o de administrador;
      descargarlos, cualquier miembro del hogar.\\n\\n[4] Miembros y roles \xB7 Salir
      de un hogar\\nCualquier miembro puede salir de un hogar, salvo el \xFAltimo
      administrador: un hogar necesita siempre uno, as\xED que\\nantes tiene que nombrar
      a otro. Tus movimientos se quedan en el hogar; tus conversaciones con el\\nasistente
