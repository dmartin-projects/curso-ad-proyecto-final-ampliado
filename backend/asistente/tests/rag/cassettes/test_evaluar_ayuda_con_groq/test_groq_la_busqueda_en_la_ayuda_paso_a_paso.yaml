    body: "{\"model\":\"openai/gpt-oss-20b\",\"messages\":[{\"role\":\"user\",\"content\":\"Pregunta
      de una persona sobre la app Gastos: \xBFc\xF3mo meto los movimientos de mi banco
      sin teclearlos uno a uno?\\n\\nPasajes de la ayuda de la app:\\n[1] Movimientos
      y cuentas \xB7 Cuentas\\nCada movimiento es de una cuenta del hogar (la del
      banco, la tarjeta, el efectivo\u2026). El saldo de cada cuenta es la\\nsuma
      de sus movimientos. Una cuenta que ya no usas se puede desactivar: sus movimientos
      se quedan.\\n\\n[2] Movimientos y cuentas \xB7 Apuntar un gasto o un ingreso\\nEn
      **Movimientos**, pulsa **Nuevo**: importe, concepto, fecha, cuenta y categor\xEDa.
      Un gasto es un importe negativo\\ny un ingreso, positivo; el formulario lo pone
      por ti seg\xFAn la categor\xEDa (las de ingresos est\xE1n marcadas as\xED en\\n**Categor\xEDas**).
      Tambi\xE9n puedes ped\xEDrselo al asistente (\\\"apunta 3,50 \u20AC de churros\\\"):
      te prepara el movimiento y no se\\nguarda hasta que lo confirmas.\\n\\n[3] Importar
      el extracto del banco \xB7 Qu\xE9 pasa al subirlo\\nEl extracto se analiza en
      segundo plano. Ver\xE1s el periodo, los gastos y los ingresos que contiene y
      cu\xE1ntas filas se\\nvan a importar. Revisa y confirma: entonces se crean los
      movimientos.\\n\\n[4] Movimientos y cuentas \xB7 Buscar y filtrar\\nEn **Movimientos**
      puedes buscar por concepto o comercio (sin importar tildes ni may\xFAsculas)
      y filtrar por fechas,\\ncuenta y categor\xEDa. Los movimientos **Por revisar**
      son los que vienen de un ticket o de un extracto y necesitan\\nque alguien los
      mire.\\n\\n[5] Importar el extracto del banco \xB7 Qu\xE9 archivos sirven\\nEn
      **Importar extracto**, elige la cuenta y sube el extracto que descargas de tu
      banco, en **CSV** o en **PDF**\\n(hasta 5 MB). Gastos detecta solo el separador,
      la codificaci\xF3n, las l\xEDneas de cabecera, el formato de las fechas y\\nde
      los importes (\\\"1.234,56\\\" o \\\"1,234.56\\\", una columna de importe o
      dos de cargo y abono).\\n\\n[6] Movimientos y cuentas \xB7 Editar y borrar\\nDesde
      el men\xFA de cada movimiento (los tres puntos) puedes editarlo o borrarlo.
      Borrar no se puede deshacer. Un\\nmovimiento que viene de un ticket conserva
      el enlace a su ticket.\\n\\n[7] Importar el extracto del banco \xB7 Gastos que
      ya hab\xEDas apuntado\\nSi ya apuntaste un gasto a mano o con un ticket, y el
      banco trae ese mismo cargo (mismo importe, con hasta 3 d\xEDas\\nde diferencia),
      Gastos los empareja (concilia) en lugar de duplicarlo. Si el emparejamiento
      no es correcto, puedes\\ndeshacerlo e importar la fila como gasto nuevo.\\n\\n[8]
      Empezar con Gastos \xB7 Las secciones de la app\\nDentro de un hogar, el men\xFA
      tiene: **Resumen** (el dashboard del mes), **Movimientos**, **Tickets**, **Importar\\nextracto**,
      **Presupuestos**, **Categor\xEDas**, **Informes** y **Asistente**. Tu cuenta
      (contrase\xF1a, m\xE9todos de\\nacceso, verificaci\xF3n en dos pasos, sesiones
      y aplicaciones conectadas) est\xE1 en el men\xFA de tu usuario, arriba a la\\nderecha.\\n\\n\xBFQu\xE9
      pasajes ayudan a contestar la pregunta? Devuelve sus n\xFAmeros, del que mejor
      la contesta al que menos, como mucho 3. Si ninguno la contesta, una lista vac\xEDa.\"}],\"max_completion_tokens\":400,\"reasoning_effort\":\"low\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"pasajes_relevantes\",\"schema\":{\"additionalProperties\":false,\"properties\":{\"relevantes\":{\"items\":{\"type\":\"integer\"},\"type\":\"array\"}},\"required\":[\"relevantes\"],\"type\":\"object\"},\"strict\":true}}}"
