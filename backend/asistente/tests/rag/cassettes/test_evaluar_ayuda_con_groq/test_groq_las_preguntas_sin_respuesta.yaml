      de la ayuda de la app:\\n[1] El asistente \xB7 L\xEDmites\\nCada pregunta cuesta,
      as\xED que hay un l\xEDmite al d\xEDa por persona y otro al mes por hogar, seg\xFAn
      el plan. Cuando te\\nqueda poco, el chat te lo dice; si se acaba, vuelve a haber
      al d\xEDa siguiente (o al mes siguiente, si es el del hogar).\\n\\n[2] Informes
      mensuales en PDF \xB7 Pedir uno a mano\\nEn **Informes**, elige el **Mes** y
      pulsa **Generar**. Marca **Enviar tambi\xE9n por email** si quieres recibirlo
      por\\ncorreo. Se genera en segundo plano: tarda unos segundos y aparece en la
      lista.\\n\\n[3] Importar el extracto del banco \xB7 Qu\xE9 pasa al subirlo\\nEl
      extracto se analiza en segundo plano. Ver\xE1s el periodo, los gastos y los
      ingresos que contiene y cu\xE1ntas filas se\\nvan a importar. Revisa y confirma:
      entonces se crean los movimientos.\\n\\n[4] Informes mensuales en PDF \xB7 El
      informe de cada mes\\nEl d\xEDa 1 de cada mes, Gastos prepara el informe en
      PDF del mes anterior de cada hogar: los totales, el gasto por\\ncategor\xEDa,
      los presupuestos y la lista de movimientos. Aparece en **Informes**, listo para
      descargar.\\n\\n[5] Tickets: una foto y el gasto se apunta solo \xB7 Cu\xE1nto
      tarda\\nUn ticket tarda unos segundos: se procesa en segundo plano y te llega
      un aviso cuando est\xE1 listo. No hace falta\\nquedarse en la p\xE1gina.\\n\\n[6]
      El asistente \xB7 Qu\xE9 puedes preguntarle\\nEl asistente contesta con los
      datos de tu hogar: cu\xE1nto hab\xE9is gastado y en qu\xE9, comparaciones entre
      meses, c\xF3mo vais\\nde presupuesto, c\xF3mo acabar\xE9is el mes, en qu\xE9
      comercios gast\xE1is m\xE1s, lo que dice un ticket, el tipo de cambio de una\\nmoneda
      o c\xF3mo han subido los precios (IPC). Tambi\xE9n dibuja gr\xE1ficos y exporta
      movimientos a CSV. Y contesta dudas\\nsobre c\xF3mo se usa la app, con esta
      ayuda.\\n\\n[7] Informes mensuales en PDF \xB7 Qui\xE9n puede\\nPedir un informe
      necesita el rol de miembro o de administrador; descargarlos, cualquier miembro
      del hogar.\\n\\n[8] Empezar con Gastos \xB7 Moneda y zona horaria\\nCada hogar
      tiene su moneda (euros, por defecto) y su zona horaria (Europe/Madrid). La zona
      horaria decide qu\xE9 es\\n\\\"hoy\\\" y \\\"este mes\\\" en los res\xFAmenes,
      en los presupuestos y en el asistente: un gasto de las 23:30 del d\xEDa 31 es
      de\\nese mes, no del siguiente.\\n\\n\xBFQu\xE9 pasajes ayudan a contestar la
      pregunta? Devuelve sus n\xFAmeros, del que mejor la contesta al que menos, como
      mucho 3. Si ninguno la contesta, una lista vac\xEDa.\"}],\"max_completion_tokens\":400,\"reasoning_effort\":\"low\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"pasajes_relevantes\",\"schema\":{\"additionalProperties\":false,\"properties\":{\"relevantes\":{\"items\":{\"type\":\"integer\"},\"type\":\"array\"}},\"required\":[\"relevantes\"],\"type\":\"object\"},\"strict\":true}}}"
