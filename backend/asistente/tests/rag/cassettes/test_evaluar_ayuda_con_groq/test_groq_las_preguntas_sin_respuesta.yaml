- request:
    body: "{\"model\":\"openai/gpt-oss-20b\",\"messages\":[{\"role\":\"user\",\"content\":\"Pregunta
      de una persona sobre la app Gastos: \xBFhay una app de Gastos para el Apple
      Watch?\\n\\nPasajes de la ayuda de la app:\\n[1] Empezar con Gastos \xB7 Las
      secciones de la app\\nDentro de un hogar, el men\xFA tiene: **Resumen** (el
      dashboard del mes), **Movimientos**, **Tickets**, **Importar\\nextracto**, **Presupuestos**,
      **Categor\xEDas**, **Informes** y **Asistente**. Tu cuenta (contrase\xF1a, m\xE9todos
      de\\nacceso, verificaci\xF3n en dos pasos, sesiones y aplicaciones conectadas)
      est\xE1 en el men\xFA de tu usuario, arriba a la\\nderecha.\\n\\n[2] Categor\xEDas
      \xB7 Gastos e ingresos\\nCada categor\xEDa es de gastos o de ingresos (**Es
      de ingresos**). As\xED el formulario de movimientos sabe el signo del\\nimporte
      y los res\xFAmenes separan lo que entra de lo que sale.\\n\\n[3] Presupuestos
      y avisos \xB7 El aviso al superarlo\\nCuando el gasto de la categor\xEDa llega
      al l\xEDmite, todos los miembros reciben un aviso en la app (la campana de\\nnotificaciones),
      al momento. Si despu\xE9s baja (por ejemplo, porque se borra un gasto), el aviso
      se rearma: si se vuelve\\na superar, se vuelve a avisar.\\n\\n[4] Movimientos
      y cuentas \xB7 Apuntar un gasto o un ingreso\\nEn **Movimientos**, pulsa **Nuevo**:
      importe, concepto, fecha, cuenta y categor\xEDa. Un gasto es un importe negativo\\ny
      un ingreso, positivo; el formulario lo pone por ti seg\xFAn la categor\xEDa
      (las de ingresos est\xE1n marcadas as\xED en\\n**Categor\xEDas**). Tambi\xE9n
      puedes ped\xEDrselo al asistente (\\\"apunta 3,50 \u20AC de churros\\\"): te
      prepara el movimiento y no se\\nguarda hasta que lo confirmas.\\n\\n[5] El asistente
      \xB7 Qu\xE9 puedes preguntarle\\nEl asistente contesta con los datos de tu hogar:
      cu\xE1nto hab\xE9is gastado y en qu\xE9, comparaciones entre meses, c\xF3mo
      vais\\nde presupuesto, c\xF3mo acabar\xE9is el mes, en qu\xE9 comercios gast\xE1is
      m\xE1s, lo que dice un ticket, el tipo de cambio de una\\nmoneda o c\xF3mo han
      subido los precios (IPC). Tambi\xE9n dibuja gr\xE1ficos y exporta movimientos
      a CSV. Y contesta dudas\\nsobre c\xF3mo se usa la app, con esta ayuda.\\n\\n[6]
      Empezar con Gastos \xB7 Qu\xE9 es un hogar\\nEn Gastos todo pertenece a un **hogar**:
      las cuentas, los movimientos, las categor\xEDas, los presupuestos y los\\ninformes.
      Un hogar puede ser tu casa, un piso compartido o la econom\xEDa de una pareja.
      Puedes pertenecer a varios\\nhogares y cambiar de uno a otro desde **Mis hogares**.\\n\\n[7]
      La seguridad de tu cuenta \xB7 Verificaci\xF3n en dos pasos\\nEn **Seguridad**,
      activa la **Verificaci\xF3n en dos pasos** con una app de c\xF3digos (Google
      Authenticator, 1Password\u2026):\\nescanea el c\xF3digo QR y escribe el **C\xF3digo
      de 6 cifras**. Guarda los **c\xF3digos de recuperaci\xF3n** que te ense\xF1a:
      cada\\nuno sirve una vez si pierdes el m\xF3vil. Si los gastas, **Generar c\xF3digos
      nuevos**.\\n\\n[8] Movimientos y cuentas \xB7 Exportar a CSV\\nEl asistente
      puede exportar tus movimientos a un CSV (para Excel u otra hoja de c\xE1lculo):
      p\xEDdeselo con las fechas\\nque quieras (\\\"p\xE1same a Excel los gastos de
      septiembre\\\"). El archivo usa punto y coma como separador y se abre\\ndirectamente
      en Excel en espa\xF1ol.\\n\\n\xBFQu\xE9 pasajes ayudan a contestar la pregunta?
      Devuelve sus n\xFAmeros, del que mejor la contesta al que menos, como mucho
      3. Si ninguno la contesta, una lista vac\xEDa.\"}],\"max_completion_tokens\":400,\"reasoning_effort\":\"low\",\"response_format\":{\"type\":\"json_schema\",\"json_schema\":{\"name\":\"pasajes_relevantes\",\"schema\":{\"additionalProperties\":false,\"properties\":{\"relevantes\":{\"items\":{\"type\":\"integer\"},\"type\":\"array\"}},\"required\":[\"relevantes\"],\"type\":\"object\"},\"strict\":true}}}"
