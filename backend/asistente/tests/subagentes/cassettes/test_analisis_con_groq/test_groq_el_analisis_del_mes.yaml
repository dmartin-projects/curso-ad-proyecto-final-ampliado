        37,50\u202F\u20AC en **Renfe**, 23,40\u202F\u20AC en **Bar Manolo** y 17,99\u202F\u20AC
        en **Netflix**.\\n\\n**Movimientos que llaman la atenci\xF3n**  \\n- **Renfe**
        (37,50\u202F\u20AC): gasto puntual de transporte, fuera de la rutina habitual
        de alimentaci\xF3n.  \\n- **Bar Manolo** (23,40\u202F\u20AC): consumo fuera
        de casa, quiz\xE1 una salida puntual.  \\n\\n**Pagos recurrentes**  \\n- **Netflix**
        (17,99\u202F\u20AC) aparece como gasto \xFAnico en septiembre, pero al ser
        una suscripci\xF3n mensual es un pago recurrente que probablemente se repita
        cada mes.  \\n\\nEn resumen, Mercadona concentra la mayor parte del gasto;
