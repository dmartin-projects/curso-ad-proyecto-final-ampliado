# ── Parte 7: el asistente. El dominio es Python puro (sus value objects son dataclasses, ni siquiera pydantic) y solo
# infrastructure/llm habla con el proveedor: el SDK de OpenAI (y su cliente HTTP) no aparece en nada más. Cambiar de
# proveedor es escribir otro adapter en esa carpeta.
[[tool.importlinter.contracts]]
id = "asistente-dominio-puro"
name = "El dominio del asistente es Python puro"
type = "forbidden"
source_modules = ["asistente.domain"]
forbidden_modules = ["pydantic", "openai", "httpx2", "tenacity"]

[[tool.importlinter.contracts]]
id = "asistente-proveedores"
name = "Solo infrastructure/llm habla con el proveedor del LLM (y, desde el módulo 95, infrastructure/externos con los servicios de las tools)"
type = "forbidden"
source_modules = ["asistente.infrastructure.container", "asistente.infrastructure.finanzas", "asistente.infrastructure.hogares", "asistente.infrastructure.tickets", "asistente.management"]
forbidden_modules = ["openai", "httpx2", "httpx", "tenacity"]
allow_indirect_imports = true

# ── Módulo 91: el social login. Con los proveedores (Authlib, joserfc, HTTP) solo hablan sus adapters ──
# Los tokens de Google, GitHub o Apple no pueden aparecer en una view, un serializer o un repositorio si ninguno de ellos
# importa siquiera las librerías con las que se piden (directamente: a través del contenedor, sí, como todo).
[[tool.importlinter.contracts]]
id = "usuarios-proveedores"
name = "Solo infrastructure/providers habla con los proveedores de identidad"
type = "forbidden"
source_modules = ["usuarios.infrastructure.container", "usuarios.infrastructure.api", "usuarios.infrastructure.database", "usuarios.infrastructure.auth", "usuarios.infrastructure.cache"]
forbidden_modules = ["authlib", "joserfc", "httpx"]
allow_indirect_imports = true

# ── Módulo 92: TOTP, WebAuthn y el QR, solo en infrastructure/mfa ──
# La criptografía del segundo factor (RFC 6238, las ceremonias de WebAuthn) vive en sus adapters: una view, un
# repositorio o un use case no comprueban firmas ni códigos por su cuenta (lo hacen a través del port).
[[tool.importlinter.contracts]]
id = "usuarios-mfa"
name = "Solo infrastructure/mfa habla TOTP y WebAuthn"
type = "forbidden"
source_modules = ["usuarios.infrastructure.container", "usuarios.infrastructure.api", "usuarios.infrastructure.database", "usuarios.infrastructure.auth", "usuarios.infrastructure.cache", "usuarios.infrastructure.providers"]
forbidden_modules = ["pyotp", "webauthn", "segno"]
allow_indirect_imports = true

# ── Ejercicio 2 del módulo 88: los procesos no se conocen entre sí ──
# Tickets, importaciones e informes trabajan sobre finanzas y hogares, y avisan por sus signals; ninguno importa a
# otro (ni directa ni indirectamente). Si mañana importaciones necesita algo de tickets, es una decisión de diseño:
# se cambia aquí, a la vista de todos.
[[tool.importlinter.contracts]]
id = "procesos-independientes"
name = "Tickets, importaciones e informes no dependen unos de otros"
type = "independence"
modules = ["tickets", "importaciones", "informes"]

# ── 4. Lo que una app ofrece a las demás ──
# Su contenedor (use cases) con sus InputDTOs y su dominio; para leer, sus modelos (<app>/models.py) y sus query
# services (database/repositories/*_query_service_orm.py); sus signals (el contrato de sus avisos); de hogares, la
# base de las vistas anidadas (api/base), y de oauth, la autenticación y los permisos de la API (api/authentication,
# api/permissions, api/views/acepta_oauth.py); de usuarios (módulo 92), la autenticación de las sesiones, el step-up y
# la sesión de las páginas del authorization server (api/authentication, api/permissions, api/sessions). El resto de
# sus adapters solo los importa ella (y config, que monta las URLs y el ASGI). El adapter que habla con OTRA app
# (infrastructure/finanzas/: el anti-corruption layer) también es suyo.

[[tool.importlinter.contracts]]
id = "finanzas-adapters"
name = "Los adapters de finanzas son suyos"
type = "protected"
protected_modules = [
    "finanzas.infrastructure.api.v1",
    "finanzas.infrastructure.cache",
    "finanzas.infrastructure.database.mappers",
    "finanzas.infrastructure.database.models",
    "finanzas.infrastructure.database.querysets",
    "finanzas.infrastructure.database.services",
    "finanzas.infrastructure.database.repositories.categoria_command_repository_orm",
    "finanzas.infrastructure.database.repositories.cuenta_command_repository_orm",
