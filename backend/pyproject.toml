[project]
name = "gastos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.9.1",
    "celery>=5.6.3",
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "confluent-kafka>=2.16",
    "django>=6.1,<6.2",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-oauth-toolkit>=3.4.1",
    "django-storages[s3]>=1.14.6",
    "django-tasks-db>=0.13.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "openai>=3.41",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-botocore>=0.66b1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-django>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyotp>=2.10.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-json-logger>=4.2.0",
    "redis[hiredis]>=8.1.0",
    "segno>=1.6.6",
    "sentry-sdk>=2.72.0",
    "tenacity>=9.2.1",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
    "webauthn>=3.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "pytest-recording>=0.14",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
    "vcrpy>=9.2",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.uv]
# django-celery-beat 2.9 declara Django<6.1 aunque funciona con 6.1 (comprobado con sus migraciones,
# el admin y Beat). Sin esta línea, uv "resuelve" bajando a la 2.1.0 de 2020, que no tiene ese límite.
override-dependencies = ["django>=6.1,<6.2"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "conftest.py", "manage.py", "config/asgi.py", "config/wsgi.py", "config/settings/*", "config/urls_e2e.py", ".venv/*"]
branch = true

[tool.coverage.report]
fail_under = 85  # RNF8 (módulo 70)
show_missing = true
skip_covered = true

# ── Arquitectura (módulos 87, 88 y 90): las capas se comprueban en el CI con `uv run lint-imports` ──
[tool.importlinter]
root_packages = ["config", "core", "finanzas", "hogares", "eventos", "tickets", "importaciones", "informes", "notificaciones", "usuarios", "backoffice", "oauth", "asistente"]
include_external_packages = true # para poder prohibir django, rest_framework, celery…

# ── 1. El núcleo (domain + application) de TODAS las apps, sin frameworks ──
[[tool.importlinter.contracts]]
id = "nucleo-sin-frameworks"
name = "El dominio y la aplicación no conocen Django, DRF, Celery ni la base de datos"
type = "forbidden"
source_modules = ["*.domain", "*.application"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "django_filters", "celery", "channels", "psycopg", "opentelemetry", "confluent_kafka", "weasyprint", "pytesseract", "httpx", "authlib", "joserfc", "pyotp", "webauthn", "segno", "cryptography", "openai", "httpx2"]

[[tool.importlinter.contracts]]
id = "nucleo-compartido"
name = "El shared kernel no depende de ninguna app"
type = "forbidden"
source_modules = ["core.domain", "core.application"]
forbidden_modules = ["finanzas", "hogares", "eventos", "tickets", "importaciones", "informes", "notificaciones", "usuarios", "backoffice", "oauth", "asistente"]

# ── 2. Las capas, iguales en todas las apps (las que una app no tiene, entre paréntesis: opcionales) ──
[[tool.importlinter.contracts]]
id = "capas"
name = "Cada capa solo importa las de debajo (en todas las apps)"
type = "layers"
containers = ["finanzas", "hogares", "eventos", "tickets", "importaciones", "informes", "notificaciones", "usuarios", "backoffice", "oauth", "asistente"]
layers = [
    "(infrastructure.api) | (infrastructure.signals.receivers) | (infrastructure.metrics) | (infrastructure.web)", # adapters de entrada (HTTP, signals, métricas, páginas)
    "(infrastructure.websocket)", # adapter de entrada (Channels); la API reparte sus tickets de conexión
    "(infrastructure.tasks)", # adapter de entrada (Celery, django.tasks); los receivers encolan tareas
    "(infrastructure.relay)", # adapter de entrada del relay (eventos): el comando y la tarea lo llaman
    "(infrastructure.container)", # composition root: monta los use cases con los adapters de salida
    "(infrastructure.messaging) | (infrastructure.finanzas) | (infrastructure.hogares) | (infrastructure.tickets) | (infrastructure.externos) | (infrastructure.server) | (infrastructure.providers)", # adapters de salida: el publicador de eventos, el ACL hacia finanzas, lo que se enchufa en django-oauth-toolkit…
    "(infrastructure.cache) | (infrastructure.realtime)", # …la caché del dashboard, el aviso por WebSocket…
    "(infrastructure.database) | (infrastructure.auth) | (infrastructure.crypto) | (infrastructure.mfa) | (infrastructure.ocr) | (infrastructure.ia) | (infrastructure.lectores) | (infrastructure.pdf) | (infrastructure.i18n) | (infrastructure.llm) | (infrastructure.signals.finanzas_signals) | (infrastructure.signals.hogares_signals) | (infrastructure.signals.tickets_signals) | (infrastructure.signals.importaciones_signals) | (infrastructure.signals.informes_signals)", # …la base de datos, los servicios externos y las signals que la app ofrece
    "(application)", # use cases, sus DTOs y los ports de la aplicación
    "(domain)", # BOs, value objects, eventos, excepciones, read models e interfaces de los repositorios
]

