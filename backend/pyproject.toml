id = "finanzas-nucleo"
name = "El núcleo de finanzas no importa otras apps (solo el shared kernel)"
type = "forbidden"
source_modules = ["finanzas.domain", "finanzas.application"]
forbidden_modules = ["hogares", "eventos", "tickets", "importaciones", "informes", "notificaciones", "usuarios", "backoffice", "oauth", "asistente"]

