openapi: 3.0.3
info:
  title: API Gastos
  version: 1.0.0
paths:
  /api/v1/auth/acceso/:
    get:
      operationId: auth_acceso_retrieve
      description: 'Las formas de entrar de mi cuenta: la contraseña (si tiene) y
        los proveedores vinculados.'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acceso'
          description: ''
  /api/v1/auth/acceso/{proveedor}/:
    delete:
      operationId: auth_acceso_destroy
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/aplicaciones/:
    get:
      operationId: auth_aplicaciones_list
      description: Las aplicaciones a las que has dado acceso a tu cuenta, con lo
        que pueden hacer.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AplicacionConectada'
          description: ''
  /api/v1/auth/aplicaciones/{client_id}/:
    delete:
      operationId: auth_aplicaciones_destroy
      description: 'Retira el acceso a una aplicación: sus tokens dejan de valer al
        momento.'
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/cambiar-password/:
    post:
      operationId: auth_cambiar_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/completar-registro/:
    post:
      operationId: auth_completar_registro_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevaPasswordRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/establecer-password/:
    post:
      operationId: auth_establecer_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecerPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EstablecerPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inicio'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/v1/auth/mfa/:
    get:
      operationId: auth_mfa_retrieve
      description: 'GET: con qué se puede completar (la pantalla de la SPA tras volver
        de un proveedor). POST: completarlo.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factores'
          description: ''
    post:
      operationId: auth_mfa_create
      description: 'GET: con qué se puede completar (la pantalla de la SPA tras volver
        de un proveedor). POST: completarlo.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegundoFactorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SegundoFactorRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inicio'
          description: ''
  /api/v1/auth/mfa/reto/:
    post:
      operationId: auth_mfa_reto_create
      description: 'Las opciones de WebAuthn para usar una passkey como segundo factor:
        solo las de esa cuenta.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Opciones de WebAuthn (JSON, para parse…FromJSON)
  /api/v1/auth/passkey/:
    post:
      operationId: auth_passkey_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaWebAuthnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RespuestaWebAuthnRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inicio'
          description: ''
  /api/v1/auth/passkey/reto/:
    post:
      operationId: auth_passkey_reto_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Opciones de WebAuthn (JSON, para parse…FromJSON)
  /api/v1/auth/reautenticar/:
    get:
      operationId: auth_reautenticar_retrieve
      description: 'GET: con qué puede confirmar esta sesión. POST: confirmarlo (la
        sesión vuelve a ser "reciente").'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoresReautenticacion'
          description: ''
    post:
      operationId: auth_reautenticar_create
      description: 'GET: con qué puede confirmar esta sesión. POST: confirmarlo (la
        sesión vuelve a ser "reciente").'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegundoFactorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SegundoFactorRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/reautenticar/reto/:
    post:
      operationId: auth_reautenticar_reto_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Opciones de WebAuthn (JSON, para parse…FromJSON)
  /api/v1/auth/recuperar-password/:
    post:
      operationId: auth_recuperar_password_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detalle'
          description: ''
  /api/v1/auth/recuperar-password/confirmar/:
    post:
      operationId: auth_recuperar_password_confirmar_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevaPasswordRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Base para login/refresh/registro: no autentica la petición, pero
        responde 401 (no 403).'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/v1/auth/registro/:
    post:
      operationId: auth_registro_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detalle'
          description: ''
  /api/v1/auth/seguridad/:
    get:
      operationId: auth_seguridad_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seguridad'
          description: ''
  /api/v1/auth/seguridad/passkeys/:
    post:
      operationId: auth_seguridad_passkeys_create
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyNuevaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasskeyNuevaRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreada'
          description: ''
  /api/v1/auth/seguridad/passkeys/{passkey_id}/:
    delete:
      operationId: auth_seguridad_passkeys_destroy
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      parameters:
      - in: path
        name: passkey_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/seguridad/passkeys/reto/:
    post:
      operationId: auth_seguridad_passkeys_reto_create
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Opciones de WebAuthn (JSON, para parse…FromJSON)
  /api/v1/auth/seguridad/recuperacion/:
    post:
      operationId: auth_seguridad_recuperacion_create
      description: 'Ejercicio 2: códigos de recuperación nuevos (acción sensible:
        quien los tenga, se salta el móvil).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigosRecuperacion'
          description: ''
  /api/v1/auth/seguridad/totp/:
    post:
      operationId: auth_seguridad_totp_create
      description: Un secreto nuevo (sin activar todavía) con su QR.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltaTotp'
          description: ''
    delete:
      operationId: auth_seguridad_totp_destroy
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/seguridad/totp/confirmar/:
    post:
      operationId: auth_seguridad_totp_confirmar_create
      description: 'Una acción sensible: con la sesión de la SPA y una autenticación
        reciente (si no: 401 y el reto del RFC 9470).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoTotpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodigoTotpRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigosRecuperacion'
          description: ''
  /api/v1/auth/sesiones/:
    get:
      operationId: auth_sesiones_list
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionActiva'
          description: ''
  /api/v1/auth/sesiones/{sid}/:
    delete:
      operationId: auth_sesiones_destroy
      parameters:
      - in: path
        name: sid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sesiones/cerrar-las-demas/:
    post:
      operationId: auth_sesiones_cerrar_las_demas_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cerradas'
          description: ''
  /api/v1/auth/social/:
    get:
      operationId: auth_social_retrieve
      description: 'Los proveedores con los que se puede entrar, y el origen de la
        app: fuera de él, la SPA no los ofrece.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedoresSociales'
          description: ''
  /api/v1/auth/social/{proveedor}/entrar/:
    get:
      operationId: auth_social_entrar_retrieve
      description: 'GET /social/<proveedor>/entrar/?volver=/hogares/3: un enlace del
        login de la SPA. Redirige al proveedor.'
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      - in: query
        name: volver
        schema:
          type: string
        description: Ruta de la SPA a la que volver tras entrar (solo rutas de Gastos)
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: Redirección (al proveedor, o de vuelta a la SPA)
  /api/v1/auth/social/{proveedor}/reautenticar/:
    post:
      operationId: auth_social_reautenticar_create
      description: |-
        Módulo 92, ejercicio 3: POST con el JWT de la SPA: la URL del proveedor para confirmar quién eres (step-up de una
        cuenta sin contraseña). A la vuelta, la sesión de este JWT queda reautenticada y se vuelve a `volver`.
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VolverRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdaAlProveedor'
          description: ''
  /api/v1/auth/social/{proveedor}/vincular/:
    post:
      operationId: auth_social_vincular_create
      description: |-
        POST con el JWT de la SPA: la URL del proveedor para vincularlo a MI cuenta. La SPA navega a ella. Añade una
        forma de entrar: es una acción sensible.
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdaAlProveedor'
          description: ''
  /api/v1/auth/social/{proveedor}/vuelta/:
    get:
      operationId: auth_social_vuelta_retrieve
      description: La redirect URI registrada en el proveedor. GET (code y state en
        la query) o, en Apple, POST (form_post).
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: Redirección (al proveedor, o de vuelta a la SPA)
    post:
      operationId: auth_social_vuelta_create
      description: La redirect URI registrada en el proveedor. GET (code y state en
        la query) o, en Apple, POST (form_post).
      parameters:
      - in: path
        name: proveedor
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: Redirección (al proveedor, o de vuelta a la SPA)
  /api/v1/backoffice/auditoria/:
    get:
      operationId: backoffice_auditoria_list
      description: 'Solo lectura, también para el superusuario: una auditoría que
        se puede editar no sirve.'
      parameters:
      - in: query
        name: accion
        schema:
          type: string
          enum:
          - borrar
          - crear
          - modificar
        description: |-
          * `crear` - Crear
          * `modificar` - Modificar
          * `borrar` - Borrar
      - in: query
        name: modelo
        schema:
          type: string
        description: app.modelo, p. ej. finanzas.movimiento
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - backoffice
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditoriaList'
          description: ''
  /api/v1/backoffice/auditoria/{id}/:
    get:
      operationId: backoffice_auditoria_retrieve
      description: 'Solo lectura, también para el superusuario: una auditoría que
        se puede editar no sirve.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este registro auditoria.
        required: true
      tags:
      - backoffice
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoria'
          description: ''
  /api/v1/backoffice/estado/:
    get:
      operationId: backoffice_estado_retrieve
      description: 'Estado de las colas y los procesos, para un servicio de monitorización
        (OAuth: client credentials).'
      tags:
      - backoffice
      security:
      - oauth2:
        - operaciones:leer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resumen'
          description: ''
  /api/v1/backoffice/hogares/:
    get:
      operationId: backoffice_hogares_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
