components:
  schemas:
    Acceso:
      type: object
      properties:
        contrasena:
          type: boolean
        identidades:
          type: array
          items:
            $ref: '#/components/schemas/IdentidadVinculada'
        passkeys:
          type: integer
      required:
      - contrasena
      - identidades
      - passkeys
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    Actualizadas:
      type: object
      properties:
        actualizadas:
          type: integer
      required:
      - actualizadas
    AgotadaPorEnum:
      enum:
      - persona
      - hogar
      type: string
      description: "* `` - \n* `persona` - persona\n* `hogar` - hogar"
    AltaTotp:
      type: object
      properties:
        secreto:
          type: string
        uri:
          type: string
        qr:
          type: string
      required:
      - qr
      - secreto
      - uri
    AnalisisPedido:
      type: object
      properties:
        tarea:
          type: string
          format: uuid
        mes:
          type: string
      required:
      - mes
      - tarea
    AplicacionConectada:
      type: object
      properties:
        client_id:
          type: string
        nombre:
          type: string
        scopes:
          type: array
          items:
            type: string
        desde:
          type: string
          format: date-time
        ultimo_uso:
          type: string
          format: date-time
      required:
      - client_id
      - desde
      - nombre
      - scopes
      - ultimo_uso
    Auditoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        usuario:
          type: string
          format: email
          readOnly: true
          nullable: true
        accion:
          allOf:
          - $ref: '#/components/schemas/AuditoriaAccionEnum'
          readOnly: true
        modelo:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        representacion:
          type: string
          readOnly: true
        cambios:
          readOnly: true
      required:
      - accion
      - cambios
      - fecha
      - id
      - modelo
      - object_id
      - representacion
      - usuario
    AuditoriaAccionEnum:
      enum:
      - crear
      - modificar
      - borrar
      type: string
      description: |-
        * `crear` - Crear
        * `modificar` - Modificar
        * `borrar` - Borrar
    BlankEnum:
      enum:
      - ''
    CambiarPasswordRequest:
      type: object
      properties:
        actual:
          type: string
          writeOnly: true
          minLength: 1
        nueva:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - actual
      - nueva
    Carpeta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 60
        conversaciones:
          type: integer
          readOnly: true
      required:
      - conversaciones
      - id
      - nombre
    CarpetaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - nombre
    Categoria:
      type: object
      description: 'Limita los campos relacionados al hogar de la URL: no se puede
        apuntar a datos de otro hogar (módulo 33).'
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 60
        padre:
          type: integer
          nullable: true
        color:
          type: string
          maxLength: 7
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
          maximum: 32767
          minimum: 0
        es_ingreso:
          type: boolean
          title: Es de ingresos
      required:
      - id
      - nombre
    CategoriaDashboard:
      type: object
      properties:
        categoria:
          type: integer
          nullable: true
        nombre:
          type: string
        color:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        porcentaje:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
      required:
      - categoria
      - color
      - nombre
      - porcentaje
      - total
    CategoriaRequest:
      type: object
      description: 'Limita los campos relacionados al hogar de la URL: no se puede
        apuntar a datos de otro hogar (módulo 33).'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 60
        padre:
          type: integer
          nullable: true
        color:
          type: string
          minLength: 1
          maxLength: 7
        icono:
          type: string
          maxLength: 40
        orden:
          type: integer
          maximum: 32767
          minimum: 0
        es_ingreso:
          type: boolean
          title: Es de ingresos
      required:
      - nombre
    Cerradas:
      type: object
      properties:
        cerradas:
          type: integer
      required:
      - cerradas
    CodigoTotpRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
      required:
      - codigo
    CodigosRecuperacion:
      type: object
      properties:
        codigos:
          type: array
          items:
            type: string
      required:
      - codigos
    Comercio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
      required:
      - id
      - nombre
    ComercioDashboard:
      type: object
      properties:
        comercio:
          type: integer
        nombre:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        veces:
          type: integer
      required:
      - comercio
      - nombre
      - total
      - veces
    ComercioRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - nombre
    ConfirmarImportacionRequest:
      type: object
      properties:
        separar:
          type: array
          items:
            type: integer
          maxItems: 5000
    ConfirmarTicketRequest:
      type: object
      description: 'Limita los campos relacionados al hogar de la URL: no se puede
        apuntar a datos de otro hogar (módulo 33).'
      properties:
        fecha:
          type: string
          format: date
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        concepto:
          type: string
          minLength: 1
          maxLength: 255
        categoria:
          type: integer
          nullable: true
      required:
      - concepto
      - fecha
      - total
    Contador:
      type: object
      properties:
        no_leidas:
          type: integer
      required:
      - no_leidas
    Conversacion:
      type: object
      description: Lee un ConversacionOutputDTO; al crear, la carpeta (opcional);
        al modificar, el título o la carpeta.
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 80
        carpeta:
          type: integer
          nullable: true
        actualizada:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - actualizada
      - id
    ConversacionDetalle:
      type: object
      properties:
        conversacion:
          $ref: '#/components/schemas/Conversacion'
        mensajes:
          type: array
          items:
            $ref: '#/components/schemas/Mensaje'
      required:
      - conversacion
      - mensajes
    ConversacionRequest:
      type: object
      description: Lee un ConversacionOutputDTO; al crear, la carpeta (opcional);
        al modificar, el título o la carpeta.
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 80
        carpeta:
          type: integer
          nullable: true
    Cuenta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        tipo:
          $ref: '#/components/schemas/CuentaTipoEnum'
        iban:
          type: string
          maxLength: 34
        activa:
          type: boolean
        saldo:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - nombre
      - saldo
    CuentaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        tipo:
          $ref: '#/components/schemas/CuentaTipoEnum'
        iban:
          type: string
          maxLength: 34
        activa:
          type: boolean
      required:
      - nombre
    CuentaTipoEnum:
      enum:
      - banco
      - tarjeta
      - efectivo
      type: string
      description: |-
        * `banco` - Cuenta bancaria
        * `tarjeta` - Tarjeta
        * `efectivo` - Efectivo
    Cuota:
      type: object
      properties:
        plan:
          type: string
        tokens_hoy:
          type: integer
          description: Los de quien pide, hoy (en el día del hogar)
        tokens_dia:
          type: integer
          description: Los que permite su plan al día, por persona
        coste_mes:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          description: USD del hogar este mes
        coste_mes_maximo:
