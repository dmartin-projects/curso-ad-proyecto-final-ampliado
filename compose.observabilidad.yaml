# compose.observabilidad.yaml — OpenTelemetry + Grafana EN LOCAL (módulo 84)
#   docker compose -f compose.yaml -f compose.observabilidad.yaml up -d
# Django y Celery siguen en tu Mac; envían su telemetría al collector con (en backend/.env):
#   OTEL_ENABLED=true  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318  OTEL_SERVICE_NAME=gastos-web
# Grafana: http://localhost:3000 (sin contraseña en local). Las versiones, fijas: son las probadas.
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observabilidad/otelcol.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"] # OTLP por gRPC y por HTTP
    depends_on: [tempo, loki, prometheus]

  tempo: # trazas
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/observabilidad/tempo.yaml:/etc/tempo.yaml:ro", "tempodata:/var/tempo"]

  loki: # logs
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./infra/observabilidad/loki.yaml:/etc/loki/config.yaml:ro", "lokidata:/loki"]

  prometheus: # métricas
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver # acepta métricas OTLP en /api/v1/otlp (las empuja el collector)
    volumes: ["./infra/observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # SOLO en local: entras sin usuario
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro # fuentes, paneles y alertas
      - ./infra/observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [tempo, loki, prometheus]

volumes:
  tempodata:
  lokidata:
  promdata:
  grafanadata:
