# compose.prod.yaml — un ENTORNO de Gastos en la VM (módulos 64, 68, 83 y 86)
# Módulo 86: el mismo archivo para producción y staging. Cada uno en su directorio (/opt/gastos/produccion,
# /opt/gastos/staging) con su .env, que da el nombre del proyecto: contenedores, volúmenes y red propios
# (gastos_pgdata, gastos-staging_pgdata…). Producción sigue llamándose "gastos": los volúmenes del módulo 83.
# La puerta (Caddy, puertos 80/443) ya no está aquí: es compartida, compose.edge.yaml.
name: ${COMPOSE_PROJECT_NAME:?Falta COMPOSE_PROJECT_NAME en .env (gastos o gastos-staging)}
x-backend: &backend
  image: ghcr.io/${GHCR_OWNER}/gastos-backend:${VERSION:-latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
    rabbitmq: { condition: service_healthy }
  healthcheck:
    disable: true # la imagen trae el de la web (curl :8000); los demás procesos no escuchan en ese puerto
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Los procesos que usan la BD esperan a las migraciones. Sin esto, en el PRIMER despliegue beat y
# tasks-worker arrancan antes que migrate, fallan con "relation … does not exist" y solo se
# recuperan porque restart: unless-stopped los relanza (comprobado con docker compose up).
x-tras-migrar: &tras-migrar
  migrate: { condition: service_completed_successfully }
  redis: { condition: service_started }
  rabbitmq: { condition: service_healthy }

# Módulo 85: el servicio de estadísticas (FastAPI). Su propia imagen, su propia base de datos (en el mismo
# PostgreSQL, con su propio usuario) y su propia configuración: no recibe el .env de Django.
x-estadisticas: &estadisticas
  image: ghcr.io/${GHCR_OWNER}/gastos-estadisticas:${VERSION:-latest}
  restart: unless-stopped
  environment: &estadisticas-entorno
    DATABASE_URL: postgresql+psycopg://estadisticas:${ESTADISTICAS_DB_PASSWORD}@db:5432/estadisticas
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    JWT_SIGNING_KEY: ${JWT_SIGNING_KEY} # la de Django: así acepta sus tokens
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-celery-ping: &celery-ping
  test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
  interval: 60s
  timeout: 20s
  retries: 3

services:
  migrate:
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-migrate }
    # módulo 100: y el índice de la ayuda al día (incremental: solo lo que ha cambiado en asistente/ayuda/)
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py indexar_ayuda"]
    restart: "no"

  web:
    <<: *backend
    depends_on: *tras-migrar
    environment:
      DB_POOL_MAX: "4" # pool de conexiones por proceso (prod.py): ASGI + CONN_MAX_AGE agota PostgreSQL
      # Módulo 86: que uvicorn crea el X-Forwarded-For de Caddy (por defecto solo el de 127.0.0.1). Así los logs
      # de acceso dicen la IP del navegador, no la de Caddy. Seguro: a la web solo llega Caddy (red interna)
      FORWARDED_ALLOW_IPS: "*"
      OTEL_SERVICE_NAME: gastos-web # módulo 84: cada proceso, con su nombre en Grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    expose: ["8000"]
    networks:
      default:
      edge: # módulo 86: Caddy (compose.edge.yaml) la encuentra como web-produccion o web-staging
        aliases: ["web-${ENTORNO:?Falta ENTORNO en .env}"]
    deploy:
      resources:
        limits: { memory: 1g }

  worker: # importaciones, presupuestos, informes (cola "default")
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-worker }
    depends_on: *tras-migrar
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "default", "-c", "2", "-n", "default@%h"]
    healthcheck:
      <<: *celery-ping
      test: ["CMD-SHELL", "celery -A config inspect ping -d default@$$HOSTNAME --timeout 10 || exit 1"]

  worker-ocr: # tickets: Tesseract + IA (cola "ocr"), uno a uno y reciclado cada 50
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-worker-ocr }
    depends_on: *tras-migrar
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ocr", "-c", "1",
              "--max-tasks-per-child", "50", "-n", "ocr@%h"]
    healthcheck:
      <<: *celery-ping
      test: ["CMD-SHELL", "celery -A config inspect ping -d ocr@$$HOSTNAME --timeout 10 || exit 1"]
    deploy:
      resources:
        limits: { memory: 2g }

  beat: # UNO solo: informes del día 1 y limpieza nocturna (módulo 78)
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-beat }
    depends_on: *tras-migrar
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

  tasks-worker: # django.tasks: los correos (módulo 26)
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-tasks-worker }
    depends_on: *tras-migrar
    command: ["python", "manage.py", "db_worker", "--queue-name", "*", "--no-reload"]

  # ── Módulo 85: eventos con Kafka ──
  topics: # crea los topics con su configuración (idempotente) y termina
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-topics }
    command: ["python", "manage.py", "crear_topics"]
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }

  relay: # outbox → Kafka. UNO solo: con dos, el orden de los eventos de un mismo movimiento no está garantizado
    <<: *backend
    environment: { OTEL_SERVICE_NAME: gastos-relay }
    command: ["python", "manage.py", "publicar_eventos"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }
    stop_grace_period: 40s # termina el lote en curso (el flush espera hasta 30 s a Kafka)
    deploy:
      resources:
        limits: { memory: 256m }

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # En producción, una sola puerta: la red interna de Docker. Kafka no se publica a Internet.
      KAFKA_LISTENERS: INTERNA://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNA://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNA:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Memoria: la JVM, acotada. El resto lo usa Kafka a través de la caché de disco del sistema operativo
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms384m -Xmx384m} # módulo 86: staging, menos (entornos/staging.env)
    volumes: [kafkadata:/var/lib/kafka/data]
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  estadisticas-bd: # crea (si no existen) el usuario y la base de datos del servicio, y termina
    image: postgres:17
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      ESTADISTICAS_DB_PASSWORD: ${ESTADISTICAS_DB_PASSWORD}
    volumes: ["./infra/estadisticas-bd.sh:/estadisticas-bd.sh:ro"]
    command: ["sh", "/estadisticas-bd.sh"]
    depends_on:
      db: { condition: service_healthy }

  estadisticas-migrate:
    <<: *estadisticas
    environment:
      <<: *estadisticas-entorno
      OTEL_ENABLED: "false"
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      estadisticas-bd: { condition: service_completed_successfully }

  estadisticas-api:
    <<: *estadisticas
    environment:
      <<: *estadisticas-entorno
      OTEL_SERVICE_NAME: estadisticas-api
    expose: ["8000"]
    networks:
      default:
      edge:
        aliases: ["estadisticas-${ENTORNO}"]
    depends_on:
      estadisticas-migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 256m }

  estadisticas-consumidor: # hasta 3 réplicas (una por partición de gastos.movimientos)
    <<: *estadisticas
    environment:
      <<: *estadisticas-entorno
      OTEL_SERVICE_NAME: estadisticas-consumidor
    command: ["python", "-m", "estadisticas.consumidor"]
    healthcheck:
      disable: true # el de la imagen es el de la API
    depends_on:
      estadisticas-migrate: { condition: service_completed_successfully }
      topics: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 256m }

  collector: # módulo 84: recibe la telemetría de todos los procesos y la envía a Grafana Cloud
    image: otel/opentelemetry-collector-contrib:0.163.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observabilidad/otelcol.prod.yaml:/etc/otelcol/config.yaml:ro"]
    environment: # solo estas tres: el collector no necesita (ni debe ver) el resto del .env
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    expose: ["4318"] # solo en la red interna: nada de OTLP abierto a Internet
    # Sin healthcheck: la imagen no trae shell ni curl (distroless). Si cae, los SDK reintentan y
    # descartan; la aplicación sigue funcionando igual.
    deploy:
      resources:
        limits: { memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: pgvector/pgvector:pg17 # postgres:17 con pgvector (módulo 100); el volumen de datos sirve tal cual
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    shm_size: 256mb

  redis: # caché, channel layer y resultados de Celery
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]

  rabbitmq: # el broker de Celery
    image: rabbitmq:4.2-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      retries: 5

networks:
  edge: # módulo 86: la red compartida con Caddy (la crea desplegar.sh). Solo web y estadisticas-api están en ella
    name: gastos-edge
    external: true

volumes:
  kafkadata: # módulo 85
  pgdata:
  redisdata:
  rabbitdata:
