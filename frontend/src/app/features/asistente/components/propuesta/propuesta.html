<div class="rounded-lg border p-3" role="group" aria-label="Propuesta del asistente">
  <p class="m-0 flex items-start gap-2">
    <mat-icon aria-hidden="true">edit_note</mat-icon>
    <span>{{ propuesta().resumen }}</span>
  </p>
  @switch (propuesta().estado) {
    @case ('pendiente') {
      <div class="mt-2 flex gap-2">
        <button mat-flat-button (click)="confirmar.emit(propuesta())">Confirmar</button>
        <button mat-button (click)="descartar.emit(propuesta())">Descartar</button>
      </div>
    }
    @case ('confirmada') {
      <p class="m-0 mt-2 text-sm text-texto-suave">✓ Confirmada: ya está apuntado.</p>
    }
    @default {
      <p class="m-0 mt-2 text-sm text-texto-suave">Descartada.</p>
    }
  }
</div>
