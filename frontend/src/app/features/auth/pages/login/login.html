<div class="grid min-h-full place-items-center p-4">
  <mat-card class="w-full max-w-sm">
    <mat-card-header><mat-card-title>Entrar en Gastos</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formRoot]="f" class="mt-4 flex flex-col gap-2">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput type="email" autocomplete="username" [formField]="f.email" />
          @if (f.email().touched() && f.email().invalid()) {
            <mat-error>{{ f.email().errors()[0].message }}</mat-error>
          }
        </mat-form-field>
        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            autocomplete="current-password"
            [formField]="f.password"
          />
        </mat-form-field>
        @if (error()) {
          <p role="alert" class="text-sm text-error">{{ error() }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="f().submitting()">Entrar</button>
      </form>
      <p class="mt-4 flex flex-wrap justify-between gap-2 text-sm">
        <a routerLink="/recuperar" class="underline">¿Has olvidado tu contraseña?</a>
        <a routerLink="/registro" class="underline">Crear cuenta</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
