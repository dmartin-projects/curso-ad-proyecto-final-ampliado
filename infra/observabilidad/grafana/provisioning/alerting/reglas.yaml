# Alertas de Grafana (módulo 84). Se evalúan cada minuto; "for" evita avisar por un pico de segundos.
apiVersion: 1
groups:
  - orgId: 1
    name: gastos-api
    folder: Gastos
    interval: 1m
    rules:
      - uid: api-lenta
        title: La API va lenta (p95 > 1 s)
        condition: C
        for: 5m
        annotations:
          summary: "El 95 % de las peticiones a la API tarda más de 1 s desde hace 5 minutos"
          description: "Mira el panel 'Latencia p95 por ruta' y abre una traza lenta de esa ruta en Tempo"
        labels: { severidad: aviso }
        noDataState: OK # sin tráfico no hay latencia: no es un problema
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="gastos-web"}[5m])))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [1] } }] }
      - uid: api-errores
        title: Errores 5xx en la API (> 5 %)
        condition: C
        for: 5m
        annotations:
          summary: "Más del 5 % de las peticiones termina en un error 5xx"
          description: "Busca el error en Sentry (lleva el trace_id) o filtra en Loki por severity_text=ERROR"
        labels: { severidad: critica }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (sum(rate(http_server_request_duration_seconds_count{job="gastos-web",http_response_status_code=~"5.."}[5m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="gastos-web"}[5m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.05] } }] }
  # Ejercicios del módulo 84: alertas de NEGOCIO (las de arriba son técnicas)
  - orgId: 1
    name: gastos-negocio
    folder: Gastos
    interval: 1m
    rules:
      - uid: tickets-atascados
        title: Hay tickets atascados
        condition: C
        for: 15m # un ticket recién subido puede esperar en la cola; atascado de verdad, no se mueve
        annotations:
          summary: "{{ $values.A }} ticket(s) llevan más de 15 minutos pendientes o procesando"
          description: "Soporte → Tickets atascados → Reprocesar (módulo 79). ¿Está vivo worker-ocr?"
        labels: { severidad: aviso }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              # max, no sum: cada proceso de Gastos exporta el mismo recuento
              expr: max(gastos_tickets_atascados)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
      # Módulo 85, ejercicio 1: el relay del outbox está parado (o Kafka no responde)
      - uid: outbox-atascado
        title: Eventos sin publicar en Kafka
        condition: C
        for: 5m
        annotations:
          summary: "Hay eventos esperando desde hace {{ $values.A }} s: las estadísticas se están quedando atrás"
          description: "¿Está vivo el relay (docker compose ps relay)? ¿Responde Kafka? Los eventos no se pierden: salen al volver"
        labels: { severidad: aviso }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(gastos_eventos_antiguedad_seconds)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [300] } }] }
      # Módulo 85, ejercicio 2: el consumidor de estadísticas no da abasto (o está parado)
      - uid: estadisticas-retraso
        title: El servicio de estadísticas va con retraso
        condition: C
        for: 10m
        annotations:
          summary: "{{ $values.A }} mensajes de Kafka sin procesar desde hace más de 10 minutos"
          description: "¿Está vivo estadisticas-consumidor? Mira sus logs (mensajes aparcados, PostgreSQL) y el grupo en Kafka"
        labels: { severidad: aviso }
        noDataState: OK # sin dato = Kafka caído o la API sin arrancar: con Kafka caído ya avisa outbox-atascado
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(estadisticas_consumidor_retraso)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [100] } }] }
  # Módulo 98: el asistente. Lo que cuesta y lo que se nota; cada una dice qué mirar en el panel "Gastos · asistente"
  - orgId: 1
    name: gastos-asistente
    folder: Gastos
    interval: 1m
    rules:
      - uid: asistente-coste
        title: El asistente gasta más de lo previsto
        condition: C
        for: 0m # el dinero no espera: una hora cara ya es el aviso
        annotations:
          summary: "{{ $values.A }} USD en la última hora (el presupuesto es 0,50 USD/h)"
          description: "Panel 'Coste por hora, por modelo'. ¿Un hogar con un bucle? manage.py coste_asistente lo dice por hogar"
        labels: { severidad: critica }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(gastos_asistente_coste_usd_total[1h]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.5] } }] }
      - uid: asistente-reserva
        title: El modelo principal falla (contesta la reserva)
        condition: C
        for: 10m
        annotations:
          summary: "El {{ $values.A }} de las llamadas al modelo fallan con LLMNoDisponibleException desde hace 10 minutos"
          description: "Un 429 (¿la cuota diaria de Groq?) o el proveedor caído. Panel 'Llamadas al modelo que fallan, por tipo'"
        labels: { severidad: aviso }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (sum(rate(gen_ai_client_inference_duration_seconds_count{error_type="LLMNoDisponibleException"}[10m])) or vector(0)) / sum(rate(gen_ai_client_inference_duration_seconds_count[10m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.2] } }] }
      - uid: asistente-lento
        title: El asistente tarda en empezar a contestar (p95 del primer trozo > 5 s)
        condition: C
        for: 10m
        annotations:
          summary: "El 95 % de las respuestas tarda más de {{ $values.A }} s en enseñar la primera palabra"
          description: "¿Razonamiento alto? ¿El proveedor va lento? Panel 'Duración p95' y una traza lenta en Tempo"
        labels: { severidad: aviso }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(gen_ai_client_inference_time_to_first_chunk_seconds_bucket[10m])))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [5] } }] }
      # Ejercicio 2 del módulo 98: una alerta de NEGOCIO (nadie está roto: hay hogares que quieren más)
      - uid: asistente-hogares-sin-cuota
        title: Hay hogares sin cuota del asistente este mes
        condition: C
        for: 1h
        annotations:
          summary: "{{ $values.A }} hogar(es) han gastado ya la cuota del mes de su plan"
          description: "manage.py coste_asistente dice cuáles. ¿Un plan que se queda corto? ¿Un uso raro?"
        labels: { severidad: info }
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(gastos_asistente_hogares_sin_cuota)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
