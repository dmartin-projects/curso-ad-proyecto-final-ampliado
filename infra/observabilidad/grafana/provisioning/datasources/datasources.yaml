# Fuentes de datos de Grafana, ENLAZADAS entre sí (módulo 84): de una traza a sus logs, de un log a su
# traza y de una métrica a trazas de ejemplo. Los uid fijos son los que usan el panel y la alerta.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2: # desde un span: "ver los logs de esta traza"
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags: [{ key: service.name, value: service_name }]
      tracesToMetrics:
        datasourceUid: prometheus
      nodeGraph: { enabled: true }
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields: # desde una línea de log: botón "abrir la traza"
        - name: Traza
          matcherType: label # el trace_id llega como metadato estructurado del log OTLP
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Ver la traza
